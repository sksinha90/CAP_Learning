_schema-version: "3.1"
ID: soapplication
description: A simple CAP project.
version: 1.0.0
modules:
  - name: soapplication-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: soapplication-db
      - name: soapplication-xsuaa
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    build-parameters:
      builder: npm
  - name: soapplication-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: soapplication-db
    parameters:
      buildpack: nodejs_buildpack
  - name: soapplication-ui-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: soapplication-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - material.zip
          name: material
          target-path: resources/
        - artifacts:
            - customer.zip
          name: customer
          target-path: resources/
        - artifacts:
            - salesorder.zip
          name: salesorder
          target-path: resources/
  - name: material
    type: html5
    path: app/material
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: customer
    type: html5
    path: app/customer
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: salesorder
    type: html5
    path: app/salesorder
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: soapplication-approuter
    type: approuter.nodejs
    path: app # from cds.env.folders. Consider also cds.env.build.target -> gen/app
    build-parameters:
      ignore: ["node_modules/"]
    parameters:
      keep-existing-routes: true
      disk-quota: 1024M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: soapplication-xsuaa
resources:
  - name: soapplication-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: soapplication-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: soapplication-html5-srv
      service-plan: app-host
  - name: soapplication-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: false
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: soapplication-srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: soapplication-destination-service
      service-plan: lite
    requires:
      - name: srv-api
  - name: soapplication-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: soapplication-${org}-${space}
        tenant-mode: dedicated
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production
